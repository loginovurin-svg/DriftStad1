name: Build and Deploy DriftLabe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set repository Pages path
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          echo "PAGES_BASE_PATH=/${repository_name}/" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ./app
        run: npm install --no-audit --no-fund

      - name: Build game
        working-directory: ./app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print game link
        run: |
          echo "## DriftLabe is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the game](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
